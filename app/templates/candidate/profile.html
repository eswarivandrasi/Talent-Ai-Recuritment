{% extends 'base.html' %}

{% block title %}Candidate Profile - AI Recruitment System{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card-custom p-4 p-md-5">
                <h3 class="fw-bold mb-1"><i class="bi bi-person-lines-fill text-primary me-2"></i>My Profile</h3>
                <p class="text-muted small mb-4">Manage your candidate information</p>

                <form action="{{ url_for('candidate.profile') }}" method="POST">
                    <div class="mb-3">
                        <label for="full_name" class="form-label fw-semibold">Full Name</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" value="{{ candidate.full_name }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="headline" class="form-label fw-semibold">Professional Headline</label>
                        <input type="text" class="form-control" id="headline" name="headline" value="{{ candidate.headline or '' }}" placeholder="e.g. Senior Full Stack & ML Developer">
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="phone" class="form-label fw-semibold">Phone Number</label>
                            <input type="text" class="form-control" id="phone" name="phone" value="{{ candidate.phone or '' }}" placeholder="+1 (555) 000-0000">
                        </div>
                        <div class="col-md-6">
                            <label for="location" class="form-label fw-semibold">Location</label>
                            <input type="text" class="form-control" id="location" name="location" value="{{ candidate.location or '' }}" placeholder="e.g. San Francisco, CA / Remote">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="bio" class="form-label fw-semibold">Bio / Summary</label>
                        <textarea class="form-control" id="bio" name="bio" rows="4" placeholder="Brief background summary...">{{ candidate.bio or '' }}</textarea>
                    </div>

                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold">
                        <i class="bi bi-check-lg me-1"></i> Save Changes
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
