{% extends 'base.html' %}

{% block title %}Server Error - 500{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="py-5">
        <i class="bi bi-x-circle text-danger display-1"></i>
        <h1 class="fw-bold mt-3">500 - Internal Server Error</h1>
        <p class="text-muted lead mb-4">An unexpected processing error occurred. Please try again.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-4">Return to Home</a>
    </div>
</div>
{% endblock %}
