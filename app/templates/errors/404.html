{% extends 'base.html' %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="py-5">
        <i class="bi bi-exclamation-triangle text-warning display-1"></i>
        <h1 class="fw-bold mt-3">404 - Page Not Found</h1>
        <p class="text-muted lead mb-4">The requested page or resource could not be found.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-4">Return to Home</a>
    </div>
</div>
{% endblock %}
